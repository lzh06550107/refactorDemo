name: Task9 Router Login RED

on:
  push:
    branches:
      - refactor/frontend-foundation-v1

permissions:
  contents: read

jobs:
  red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend/admin
        run: npm ci

      - name: Run Task9 RED tests
        working-directory: frontend/admin
        run: npm test -- src/router/__tests__/guards.test.ts src/views/__tests__/LoginView.test.ts

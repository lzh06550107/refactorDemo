name: Architecture Migration Task 7

on:
  push:
    branches:
      - refactor/openplatform-authorizer-provisioning-r8d

permissions:
  contents: write

jobs:
  align-worker-entry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Move provisioning CLI adapter to app worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/worker/command
          git mv app/command/OpenPlatformProvisioningWorkerCommand.php app/worker/command/OpenPlatformProvisioningWorkerCommand.php

          python3 <<'PY'
          from pathlib import Path

          namespace_mapping = {
              'namespace app\\command;': 'namespace app\\worker\\command;',
              'app\\command\\': 'app\\worker\\command\\',
          }
          path_mapping = {
              'app/command': 'app/worker/command',
          }
          excluded = Path('tests/Contract/AppModulesArchitectureContractTest.php')
          for root_name in ('app', 'modules', 'tests', 'config'):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in root.rglob('*.php'):
                  if path == excluded:
                      continue
                  before = path.read_text(encoding='utf-8')
                  after = before
                  for old, new in namespace_mapping.items():
                      after = after.replace(old, new)
                  for old, new in path_mapping.items():
                      after = after.replace(old, new)
                  if after != before:
                      path.write_text(after, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## Physical architecture boundary'
          if marker not in text:
              text += '''\n\n## Physical architecture boundary\n\nThe V1 runtime keeps delivery adapters and business capabilities physically separate:\n\n- `app/admin` — administrator HTTP delivery adapter.\n- `app/api` — public/versioned API delivery adapter.\n- `app/web` — site/web HTTP delivery adapter.\n- `app/worker` — CLI/worker delivery adapter; it exposes no HTTP routes.\n- `app/common` — shared kernel for cross-cutting context, errors, audit, security, and transaction abstractions.\n- `modules/*` — business bounded contexts and their application/domain/infrastructure code.\n\nDependency direction remains `HTTP/Worker -> Application -> Domain <- Infrastructure`; business modules must not depend on the delivery applications.\n'''
              readme.write_text(text, encoding='utf-8')
          PY

      - name: Verify command namespace and registration
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'namespace app\worker\command;' app/worker/command/OpenPlatformProvisioningWorkerCommand.php
          grep -F 'use modules\openplatform\application\AuthorizerProvisioningWorker;' app/worker/command/OpenPlatformProvisioningWorkerCommand.php
          grep -F "setName('openplatform:provisioning-worker')" app/worker/command/OpenPlatformProvisioningWorkerCommand.php
          grep -F 'use app\worker\command\OpenPlatformProvisioningWorkerCommand;' config/console.php

      - name: Regenerate autoload and verify command discovery
        shell: bash
        run: |
          set -euo pipefail
          composer dump-autoload
          php -l app/worker/command/OpenPlatformProvisioningWorkerCommand.php
          php -l config/console.php
          php think list | tee /tmp/think-list.out
          grep -F 'openplatform:provisioning-worker' /tmp/think-list.out

      - name: Require Architecture Contract GREEN
        run: php -r "require 'tests/Support/bootstrap.php'; require 'tests/Contract/AppModulesArchitectureContractTest.php';"

      - name: Verify existing worker contract
        run: php -r "require 'tests/Support/bootstrap.php'; require 'tests/Contract/R8DProvisioningWorkerRuntimeContractTest.php';"

      - name: Run full offline suite
        run: php tests/run.php

      - name: Commit verified Task 7 alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/worker config/console.php README.md tests modules app
          git add -u app/command || true
          git diff --cached --check
          git commit -m 'refactor: align provisioning worker with app worker entry [architecture-migration-generated]'
          git push origin HEAD:${GITHUB_REF_NAME}

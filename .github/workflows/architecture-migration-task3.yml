name: Architecture Migration Task 5

on:
  push:
    branches:
      - refactor/openplatform-authorizer-provisioning-r8d

permissions:
  contents: write

jobs:
  migrate-identity-integration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Move member oauth webhook and miniapp modules
        shell: bash
        run: |
          set -euo pipefail
          git mv app/member modules/member
          git mv app/oauth modules/oauth
          git mv app/webhook modules/webhook
          git mv app/miniapp modules/miniapp

          python3 <<'PY'
          from pathlib import Path

          namespace_mapping = {
              'app\\member\\': 'modules\\member\\',
              'app\\oauth\\': 'modules\\oauth\\',
              'app\\webhook\\': 'modules\\webhook\\',
              'app\\miniapp\\': 'modules\\miniapp\\',
          }
          path_mapping = {
              'app/member/': 'modules/member/',
              'app/oauth/': 'modules/oauth/',
              'app/webhook/': 'modules/webhook/',
              'app/miniapp/': 'modules/miniapp/',
          }
          excluded = Path('tests/Contract/AppModulesArchitectureContractTest.php')
          for root_name in ('app', 'modules', 'tests', 'config'):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in root.rglob('*.php'):
                  if path == excluded:
                      continue
                  before = path.read_text(encoding='utf-8')
                  after = before
                  for old, new in namespace_mapping.items():
                      after = after.replace(old, new)
                  for old, new in path_mapping.items():
                      after = after.replace(old, new)
                  if after != before:
                      path.write_text(after, encoding='utf-8')
          PY

      - name: Regenerate autoload and lint moved code
        shell: bash
        run: |
          set -euo pipefail
          composer dump-autoload
          find modules/member modules/oauth modules/webhook modules/miniapp -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l app/AppService.php

      - name: Run focused identity integration regressions
        run: >-
          php -r "require 'tests/Support/bootstrap.php';
          require 'tests/Unit/Member/ExternalIdentityTest.php';
          require 'tests/Component/Member/MemberIdentityServiceTest.php';
          require 'tests/Unit/OAuth/OAuthStateTest.php';
          require 'tests/Component/OAuth/OAuthOrchestratorTest.php';
          require 'tests/Unit/Webhook/WechatSignatureVerifierTest.php';
          require 'tests/Component/Webhook/WechatWebhookServiceTest.php';
          require 'tests/Unit/MiniApp/MiniAppProviderAccountTest.php';
          require 'tests/Unit/MiniApp/MiniAppSessionTest.php';
          require 'tests/Component/MiniApp/MiniAppLoginServiceTest.php';
          require 'tests/Component/MiniApp/MiniAppSessionServiceTest.php';
          require 'tests/GoldenMaster/R20MiniAppProviderSnapshotTest.php';"

      - name: Verify architecture gate progressed and no other offline regression
        shell: bash
        run: |
          set -euo pipefail
          set +e
          php tests/run.php > /tmp/offline.out 2>&1
          status=$?
          set -e
          cat /tmp/offline.out
          test "$status" -eq 1
          grep -F '[FAIL] AppModulesArchitectureContractTest.php:' /tmp/offline.out
          test "$(grep -c '^\[FAIL\]' /tmp/offline.out)" -eq 1
          ! grep -E 'app directory: (member|oauth|webhook|miniapp)$' /tmp/offline.out

      - name: Commit verified Task 5 migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app modules tests config
          git diff --cached --check
          git commit -m 'refactor: move identity integration modules [architecture-migration-generated]'
          git push origin HEAD:${GITHUB_REF_NAME}

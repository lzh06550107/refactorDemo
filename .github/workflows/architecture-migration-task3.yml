name: Architecture Migration Task 4

on:
  push:
    branches:
      - refactor/openplatform-authorizer-provisioning-r8d

permissions:
  contents: write

jobs:
  migrate-runtime-site-theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Move runtime site and theme modules
        shell: bash
        run: |
          set -euo pipefail
          git mv app/module modules/module
          git mv app/site modules/site
          git mv app/theme modules/theme

          python3 <<'PY'
          from pathlib import Path

          namespace_mapping = {
              'app\\module\\': 'modules\\module\\',
              'app\\site\\': 'modules\\site\\',
              'app\\theme\\': 'modules\\theme\\',
          }
          path_mapping = {
              'app/module/': 'modules/module/',
              'app/site/': 'modules/site/',
              'app/theme/': 'modules/theme/',
          }
          excluded = Path('tests/Contract/AppModulesArchitectureContractTest.php')
          for root_name in ('app', 'modules', 'tests', 'config'):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in root.rglob('*.php'):
                  if path == excluded:
                      continue
                  before = path.read_text(encoding='utf-8')
                  after = before
                  for old, new in namespace_mapping.items():
                      after = after.replace(old, new)
                  for old, new in path_mapping.items():
                      after = after.replace(old, new)
                  if after != before:
                      path.write_text(after, encoding='utf-8')
          PY

      - name: Regenerate autoload and lint moved code
        shell: bash
        run: |
          set -euo pipefail
          composer dump-autoload
          find modules/module modules/site modules/theme -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run focused runtime site theme regressions
        run: >-
          php -r "require 'tests/Support/bootstrap.php';
          require 'tests/Unit/Module/RuntimeModuleResolverTest.php';
          require 'tests/Unit/Module/ModulePluginRelationTest.php';
          require 'tests/Component/Module/R20ModuleRuntimeRepositoryTest.php';
          require 'tests/Component/Module/ModuleAuthorizationServiceTest.php';
          require 'tests/GoldenMaster/LegacyModuleAdapterTest.php';
          require 'tests/Unit/Site/SiteTest.php';
          require 'tests/Component/Site/SiteDomainResolverTest.php';
          require 'tests/GoldenMaster/R20SiteSnapshotTest.php';
          require 'tests/Unit/Theme/ThemeVersionTest.php';
          require 'tests/Component/Theme/ThemeReleaseServiceTest.php';
          require 'tests/Unit/Theme/SafeThemeRendererTest.php';
          require 'tests/GoldenMaster/R20ThemeStyleSnapshotTest.php';"

      - name: Verify architecture gate progressed and no other offline regression
        shell: bash
        run: |
          set -euo pipefail
          set +e
          php tests/run.php > /tmp/offline.out 2>&1
          status=$?
          set -e
          cat /tmp/offline.out
          test "$status" -eq 1
          grep -F '[FAIL] AppModulesArchitectureContractTest.php:' /tmp/offline.out
          test "$(grep -c '^\[FAIL\]' /tmp/offline.out)" -eq 1
          ! grep -E 'app directory: (module|site|theme)$' /tmp/offline.out

      - name: Commit verified Task 4 migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app modules tests config
          git diff --cached --check
          git commit -m 'refactor: move runtime site and theme modules [architecture-migration-generated]'
          git push origin HEAD:${GITHUB_REF_NAME}

name: Architecture Migration Task 6

on:
  push:
    branches:
      - refactor/openplatform-authorizer-provisioning-r8d

permissions:
  contents: write

jobs:
  migrate-openplatform-legacy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Move OpenPlatform and legacy runtime modules
        shell: bash
        run: |
          set -euo pipefail
          git mv app/openplatform modules/openplatform
          mkdir -p modules/integration
          git mv app/legacy modules/integration/legacy

          python3 <<'PY'
          from pathlib import Path

          namespace_mapping = {
              'app\\openplatform\\': 'modules\\openplatform\\',
              'app\\legacy\\': 'modules\\integration\\legacy\\',
          }
          path_mapping = {
              'app/openplatform': 'modules/openplatform',
              'app/legacy': 'modules/integration/legacy',
          }
          excluded = Path('tests/Contract/AppModulesArchitectureContractTest.php')
          for root_name in ('app', 'modules', 'tests', 'config'):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in root.rglob('*.php'):
                  if path == excluded:
                      continue
                  before = path.read_text(encoding='utf-8')
                  after = before
                  for old, new in namespace_mapping.items():
                      after = after.replace(old, new)
                  for old, new in path_mapping.items():
                      after = after.replace(old, new)
                  if after != before:
                      path.write_text(after, encoding='utf-8')
          PY

      - name: Verify composition root has no stale migrated imports
        shell: bash
        run: |
          set -euo pipefail
          php -r '$s=file_get_contents("app/AppService.php"); foreach (["app\\openplatform\\","app\\iam\\","app\\miniapp\\","app\\quota\\"] as $x) { if (str_contains($s,$x)) { fwrite(STDERR,"stale AppService import: $x\n"); exit(1); } }'

      - name: Regenerate autoload and lint moved code
        shell: bash
        run: |
          set -euo pipefail
          composer dump-autoload
          find modules/openplatform modules/integration/legacy -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l app/AppService.php

      - name: Run focused OpenPlatform and legacy regressions
        run: >-
          php -r "require 'tests/Support/bootstrap.php';
          require 'tests/Unit/Legacy/LegacySerializedValueDecoderTest.php';
          require 'tests/Unit/OpenPlatform/ComponentPlatformTest.php';
          require 'tests/Unit/OpenPlatform/AuthorizationIntentTest.php';
          require 'tests/Unit/OpenPlatform/AuthorizerProvisioningTest.php';
          require 'tests/Unit/OpenPlatform/WechatComponentCallbackAuthenticatorTest.php';
          require 'tests/Component/OpenPlatform/AuthorizationCompletionServiceTest.php';
          require 'tests/Component/OpenPlatform/AuthorizationAutoProvisionCompletionTest.php';
          require 'tests/Component/OpenPlatform/AuthorizerMetadataSyncServiceTest.php';
          require 'tests/Component/OpenPlatform/AuthorizerOwnershipResolverTest.php';
          require 'tests/Component/OpenPlatform/AuthorizerProvisioningWorkerTest.php';
          require 'tests/Component/OpenPlatform/AuthorizerProvisioningQuotaTest.php';
          require 'tests/Component/OpenPlatform/AuthorizerReconnectLifecycleTest.php';
          require 'tests/Component/MiniApp/OpenPlatformComponentAccessTokenProviderTest.php';
          require 'tests/Component/MiniApp/OpenPlatformAuthorizerAccountBindingTest.php';"

      - name: Verify architecture gate progressed and no other offline regression
        shell: bash
        run: |
          set -euo pipefail
          set +e
          php tests/run.php > /tmp/offline.out 2>&1
          status=$?
          set -e
          cat /tmp/offline.out
          test "$status" -eq 1
          grep -F '[FAIL] AppModulesArchitectureContractTest.php:' /tmp/offline.out
          test "$(grep -c '^\[FAIL\]' /tmp/offline.out)" -eq 1
          ! grep -E 'app directory: (openplatform|legacy)$' /tmp/offline.out

      - name: Commit verified Task 6 migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app modules tests config
          git diff --cached --check
          git commit -m 'refactor: move openplatform and legacy runtime modules [architecture-migration-generated]'
          git push origin HEAD:${GITHUB_REF_NAME}

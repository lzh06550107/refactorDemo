name: Web H5 Task 2 GREEN

on:
  push:
    branches:
      - refactor/web-h5-template-foundation-v1
    paths:
      - .github/workflows/web-h5-task2-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/web-h5-template-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Web dependencies and generate lockfile
        run: npm install --prefix frontend/web
      - name: Test Web assets
        run: npm test --prefix frontend/web
      - name: Build Web assets
        run: npm run build --prefix frontend/web
      - name: Verify Vite manifest
        run: test -f public/build/web/manifest.json
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/web/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change"
            exit 0
          fi
          git commit -m "build: lock web frontend dependencies"
          git push origin HEAD:refactor/web-h5-template-foundation-v1

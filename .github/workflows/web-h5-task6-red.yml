name: Web H5 Task 6 RED

on:
  push:
    branches:
      - refactor/web-h5-template-foundation-v1
    paths:
      - .github/workflows/web-h5-task6-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/web-h5-template-foundation-v1
      - name: Run WebAssetManifest RED test
        run: php -r "require 'tests/Support/bootstrap.php'; require 'tests/Unit/Web/WebAssetManifestTest.php';"

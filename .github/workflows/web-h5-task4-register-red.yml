name: Register Web H5 Task 4 RED

on:
  push:
    branches:
      - refactor/web-h5-template-foundation-v1
    paths:
      - .github/workflows/web-h5-task4-register-red.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/web-h5-template-foundation-v1
          fetch-depth: 0
      - name: Register Task 4 tests
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/run.php')
          source = path.read_text()
          unit_anchor = "    __DIR__ . '/Unit/Theme/ThemeVersionTest.php',\n"
          unit_line = "    __DIR__ . '/Unit/Theme/ThemeManifestTest.php',\n"
          component_anchor = "    __DIR__ . '/Component/Theme/ThemeReleaseServiceTest.php',\n"
          component_line = "    __DIR__ . '/Component/Theme/FilesystemThemePackageRepositoryTest.php',\n"
          if unit_line not in source:
              if unit_anchor not in source:
                  raise SystemExit('Theme unit anchor not found')
              source = source.replace(unit_anchor, unit_anchor + unit_line, 1)
          if component_line not in source:
              if component_anchor not in source:
                  raise SystemExit('Theme component anchor not found')
              source = source.replace(component_anchor, component_anchor + component_line, 1)
          path.write_text(source)
      - name: Commit runner registration
        run: |
          if git diff --quiet -- tests/run.php; then
            echo "No runner change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/run.php
          git commit -m "test: register theme package safety tests"
          git push origin HEAD:refactor/web-h5-template-foundation-v1

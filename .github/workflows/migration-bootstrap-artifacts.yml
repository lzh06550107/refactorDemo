name: Migration bootstrap artifacts

on:
  pull_request:
    branches:
      - refactor/admin-foundation-completion-v1

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Resolve locked migration dependency
        run: composer update topthink/think-migration --with-dependencies --minimal-changes --no-interaction --no-install

      - name: Generate immutable V1 manifest
        run: |
          php -r '$files=glob("database/schema/v1/*.sql"); sort($files); foreach($files as $f){echo hash_file("sha256",$f)."  ".basename($f).PHP_EOL;}' > database/schema/v1/manifest.sha256
          test "$(wc -l < database/schema/v1/manifest.sha256)" -eq 18

      - name: Commit generated artifacts to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock database/schema/v1/manifest.sha256
          if git diff --cached --quiet; then
            echo 'Generated artifacts already match.'
            exit 0
          fi
          git commit -m 'build: lock migration dependency artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

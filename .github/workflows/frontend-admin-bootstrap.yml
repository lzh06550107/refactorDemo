name: Frontend Admin Bootstrap

on:
  push:
    branches:
      - refactor/frontend-foundation-v1

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-foundation-v1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and lock Admin dependencies
        run: npm install --prefix frontend/admin --no-audit --no-fund

      - name: Typecheck Admin
        run: npm run typecheck --prefix frontend/admin

      - name: Test Admin
        run: npm test --prefix frontend/admin

      - name: Build Admin
        run: npm run build --prefix frontend/admin

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/admin/package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git commit -m 'build: lock admin frontend dependencies'
          git push origin HEAD:refactor/frontend-foundation-v1

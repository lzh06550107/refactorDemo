name: Task4 Register RED Tests

on:
  push:
    branches:
      - refactor/frontend-foundation-v1

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-foundation-v1

      - name: Register Task4 tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/run.php')
          source = path.read_text()
          old = "    __DIR__ . '/Component/Iam/AuthenticateAdminTest.php',\n    __DIR__ . '/Component/Iam/ThinkPhpAdminUserRepositoryTest.php',\n"
          new = "    __DIR__ . '/Component/Iam/AuthenticateAdminTest.php',\n    __DIR__ . '/Component/Iam/CreateAdminSessionTest.php',\n    __DIR__ . '/Component/Iam/LogoutAdminSessionTest.php',\n    __DIR__ . '/Component/Iam/ThinkPhpAdminUserRepositoryTest.php',\n"
          if source.count(old) != 1:
              raise SystemExit('Task4 runner insertion anchor must match exactly once')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Commit registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/run.php
          git diff --cached --check
          git commit -m 'test: register admin session red tests'
          git push origin HEAD:refactor/frontend-foundation-v1

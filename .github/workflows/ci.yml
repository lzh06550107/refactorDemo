name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run offline contract suite
        run: php tests/run.php

      - name: Run PHPUnit bridge
        run: php vendor/bin/phpunit

      - name: Lint PHP
        run: find app config tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Smoke multi-app HTTP routes
        shell: bash
        run: |
          set -euo pipefail
          php think run -p 18080 > /tmp/thinkphp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          request_json() {
            local path="$1"
            local body="$2"
            local status
            status="$(curl -sS -H 'Accept: application/json' -o "$body" -w '%{http_code}' "http://127.0.0.1:18080${path}" || true)"
            printf '%s' "$status"
          }

          ready=0
          for _ in $(seq 1 30); do
            status="$(request_json /health /tmp/health-web.json)"
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            if [ "$status" != "000" ]; then
              echo "GET /health returned HTTP $status" >&2
              cat /tmp/health-web.json >&2 || true
              cat /tmp/thinkphp-server.log >&2 || true
              exit 1
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/thinkphp-server.log >&2
            exit 1
          fi

          for spec in 'admin:/admin/health' 'api:/api/v1/health'; do
            app="${spec%%:*}"
            path="${spec#*:}"
            body="/tmp/health-${app}.json"
            status="$(request_json "$path" "$body")"
            if [ "$status" != "200" ]; then
              echo "GET $path returned HTTP $status" >&2
              cat "$body" >&2 || true
              cat /tmp/thinkphp-server.log >&2 || true
              exit 1
            fi
          done

          php -r '$j=json_decode(file_get_contents("/tmp/health-web.json"), true); exit(($j["data"]["application"] ?? null) === "web" ? 0 : 1);'
          php -r '$j=json_decode(file_get_contents("/tmp/health-admin.json"), true); exit(($j["data"]["application"] ?? null) === "admin" ? 0 : 1);'
          php -r '$j=json_decode(file_get_contents("/tmp/health-api.json"), true); exit(($j["data"]["application"] ?? null) === "api" ? 0 : 1);'

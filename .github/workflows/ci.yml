name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Verify committed Composer lock
        run: test -f composer.lock

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install locked Admin frontend dependencies
        run: npm ci --prefix frontend/admin

      - name: Typecheck Admin frontend
        run: npm run typecheck --prefix frontend/admin

      - name: Test Admin frontend
        run: npm test --prefix frontend/admin

      - name: Build Admin frontend
        run: npm run build --prefix frontend/admin

      - name: Run offline contract suite
        run: php tests/run.php

      - name: Run PHPUnit bridge
        run: php vendor/bin/phpunit

      - name: Lint PHP
        run: find app modules config tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Smoke multi-app HTTP routes
        shell: bash
        run: |
          set -euo pipefail
          PHP_WEPLATFORM_ADMIN_SESSION_PEPPER=ci-admin-session-pepper \
          PHP_WEPLATFORM_OPENPLATFORM_AUTHORIZATION_CALLBACK_URI=https://example.com/api/v1/openplatform/authorization/callback \
          PHP_WEPLATFORM_OPENPLATFORM_HTTP_TIMEOUT_SECONDS=10 \
          PHP_WEPLATFORM_OPENPLATFORM_SECRET_KEY_VERSION=v1 \
          PHP_WEPLATFORM_OPENPLATFORM_SECRET_KEY_BASE64=a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s= \
          PHP_WEPLATFORM_OPENPLATFORM_CREDENTIAL_SECRETS_JSON='{"ci/ref":"ci-secret"}' \
          php think run -p 18080 > /tmp/thinkphp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          request_json() {
            local path="$1"
            local body="$2"
            local status
            status="$(curl -sS -H 'Accept: application/json' -o "$body" -w '%{http_code}' "http://127.0.0.1:18080${path}" || true)"
            printf '%s' "$status"
          }

          ready=0
          for _ in $(seq 1 30); do
            status="$(request_json /health /tmp/health-web.json)"
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            if [ "$status" != "000" ]; then
              echo "GET /health returned HTTP $status" >&2
              cat /tmp/health-web.json >&2 || true
              cat /tmp/thinkphp-server.log >&2 || true
              exit 1
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/thinkphp-server.log >&2
            exit 1
          fi

          for spec in 'admin:/admin/health' 'api:/api/v1/health'; do
            app="${spec%%:*}"
            path="${spec#*:}"
            body="/tmp/health-${app}.json"
            status="$(request_json "$path" "$body")"
            if [ "$status" != "200" ]; then
              echo "GET $path returned HTTP $status" >&2
              cat "$body" >&2 || true
              cat /tmp/thinkphp-server.log >&2 || true
              exit 1
            fi
          done

          php -r '$j=json_decode(file_get_contents("/tmp/health-web.json"), true); exit(($j["data"]["application"] ?? null) === "web" ? 0 : 1);'
          php -r '$j=json_decode(file_get_contents("/tmp/health-admin.json"), true); exit(($j["data"]["application"] ?? null) === "admin" ? 0 : 1);'
          php -r '$j=json_decode(file_get_contents("/tmp/health-api.json"), true); exit(($j["data"]["application"] ?? null) === "api" ? 0 : 1);'

          admin_csrf_headers=/tmp/admin-csrf.headers
          admin_csrf_body=/tmp/admin-csrf.json
          admin_csrf_status="$(curl -sS -D "$admin_csrf_headers" -H 'Accept: application/json' -o "$admin_csrf_body" -w '%{http_code}' 'http://127.0.0.1:18080/admin-api/v1/auth/csrf' || true)"
          if [ "$admin_csrf_status" != "200" ]; then
            echo "GET /admin-api/v1/auth/csrf returned HTTP $admin_csrf_status, expected 200" >&2
            cat "$admin_csrf_body" >&2 || true
            cat /tmp/thinkphp-server.log >&2 || true
            exit 1
          fi
          if ! grep -Eqi '^set-cookie:[[:space:]]*weplatform_admin_csrf=' "$admin_csrf_headers"; then
            echo "GET /admin-api/v1/auth/csrf did not set weplatform_admin_csrf" >&2
            cat "$admin_csrf_headers" >&2 || true
            exit 1
          fi

          admin_me_body=/tmp/admin-me-unauthenticated.json
          admin_me_status="$(request_json /admin-api/v1/auth/me "$admin_me_body")"
          if [ "$admin_me_status" != "401" ]; then
            echo "GET /admin-api/v1/auth/me returned HTTP $admin_me_status without a session, expected 401" >&2
            cat "$admin_me_body" >&2 || true
            cat /tmp/thinkphp-server.log >&2 || true
            exit 1
          fi

          admin_body=/tmp/r8d-admin-unauthenticated.json
          admin_status="$(request_json /api/v1/openplatform/provisionings/runtime-smoke "$admin_body")"
          if [ "$admin_status" != "401" ]; then
            echo "Unauthenticated R8D admin provisioning route returned HTTP $admin_status, expected 401" >&2
            cat "$admin_body" >&2 || true
            cat /tmp/thinkphp-server.log >&2 || true
            exit 1
          fi

          for path in \
            /api/v1/openplatform/components/runtime-smoke/events \
            /api/v1/openplatform/components/runtime-smoke/ticket; do
            body=/tmp/r8d-provider-ingress.json
            status="$(curl -sS -X POST -H 'Accept: application/json' -H 'Content-Type: application/xml' -d '<xml/>' -o "$body" -w '%{http_code}' "http://127.0.0.1:18080${path}" || true)"
            if [ "$status" = "000" ] || [ "$status" = "401" ]; then
              echo "Provider ingress $path returned HTTP $status; it must resolve without admin authentication middleware" >&2
              cat "$body" >&2 || true
              cat /tmp/thinkphp-server.log >&2 || true
              exit 1
            fi
          done

  release:
    name: R8D MySQL release gate
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WEPLATFORM_ACCEPTANCE: '1'
      DATABASE_HOSTNAME: 127.0.0.1
      DATABASE_DATABASE: weplatform_acceptance
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ci-root-password
      DATABASE_HOSTPORT: '3306'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup release PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, dom, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Verify committed Composer lock
        run: test -f composer.lock

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run R8D release gate
        run: php tests/Release/run.php

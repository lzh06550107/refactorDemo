name: Task4 Session Wiring

on:
  push:
    branches:
      - refactor/frontend-foundation-v1

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-foundation-v1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Patch AppService session bindings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/AppService.php')
          source = path.read_text()
          replacements = [
              (
                  'use modules\\iam\\contract\\AdminSessionRepository;\n',
                  'use modules\\iam\\contract\\AdminSessionRepository;\n'
                  'use modules\\iam\\contract\\AdminSessionStore;\n',
              ),
              (
                  'use modules\\iam\\contract\\PermissionAuthorizer;\n',
                  'use modules\\iam\\contract\\PermissionAuthorizer;\n'
                  'use modules\\iam\\contract\\SessionIdGenerator;\n'
                  'use modules\\iam\\contract\\SessionTokenGenerator;\n',
              ),
              (
                  'use modules\\iam\\infrastructure\\ThinkPhpAdminSessionRepository;\n',
                  'use modules\\iam\\infrastructure\\ThinkPhpAdminSessionRepository;\n'
                  'use modules\\iam\\infrastructure\\ThinkPhpAdminSessionStore;\n',
              ),
              (
                  'use modules\\iam\\security\\SessionTokenHasher;\n',
                  'use modules\\iam\\security\\SecureSessionIdGenerator;\n'
                  'use modules\\iam\\security\\SecureSessionTokenGenerator;\n'
                  'use modules\\iam\\security\\SessionTokenHasher;\n',
              ),
              (
                  '            AdminSessionRepository::class => ThinkPhpAdminSessionRepository::class,\n'
                  '            AdminUserRepository::class => ThinkPhpAdminUserRepository::class,\n',
                  '            AdminSessionRepository::class => ThinkPhpAdminSessionRepository::class,\n'
                  '            AdminSessionStore::class => ThinkPhpAdminSessionStore::class,\n'
                  '            AdminUserRepository::class => ThinkPhpAdminUserRepository::class,\n',
              ),
              (
                  '            PermissionAuthorizer::class => ThinkPhpPermissionAuthorizer::class,\n',
                  '            PermissionAuthorizer::class => ThinkPhpPermissionAuthorizer::class,\n'
                  '            SessionIdGenerator::class => SecureSessionIdGenerator::class,\n'
                  '            SessionTokenGenerator::class => SecureSessionTokenGenerator::class,\n',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old!r}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Verify session behavior and offline suite
        run: |
          php -l app/AppService.php
          php tests/run.php

      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/AppService.php
          git diff --cached --check
          git commit -m 'feat: wire admin session services'
          git push origin HEAD:refactor/frontend-foundation-v1

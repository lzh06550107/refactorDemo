name: Web H5 Task 8 RED

on:
  push:
    branches:
      - refactor/web-h5-template-foundation-v1
    paths:
      - .github/workflows/web-h5-task8-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/web-h5-template-foundation-v1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run WebErrorPage RED test
        run: php -r "require 'tests/Support/bootstrap.php'; require 'tests/Unit/Web/WebErrorPageTest.php';"
      - name: Run WebThemeNotFound RED test
        if: always()
        run: php -r "require 'tests/Support/bootstrap.php'; require 'tests/Component/Web/WebThemeNotFoundTest.php';"
